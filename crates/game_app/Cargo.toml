[package]
name = "game_app"
description = "The game binary: wires sim and render plugins, settings, save/load."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["dev"]
# Developer tools: the egui debug panel (UI-07).
dev = ["game_ui/debug_ui"]
# Profile with Tracy: cargo run -p game_app --release --features tracy
tracy = ["bevy/trace_tracy"]

[dependencies]
bevy.workspace = true
sim_core.workspace = true
sim_headless.workspace = true
sim_military.workspace = true
sim_agents.workspace = true
sim_world.workspace = true
game_render.workspace = true
game_ui.workspace = true

[lints]
workspace = true
