[package]
name = "sim_headless"
description = "Composes every sim_* plugin; the binary runs the simulation with no window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bevy_app.workspace = true
# The headless sim runs systems in parallel, like the game (NFR-04).
bevy_ecs = { workspace = true, features = ["multi_threaded"] }
rand.workspace = true
sim_core.workspace = true
sim_world.workspace = true
sim_agents.workspace = true
sim_economy.workspace = true
sim_military.workspace = true
sim_knowledge.workspace = true
sim_lod.workspace = true
sim_ai.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "tick"
harness = false

[lints]
workspace = true
